<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Наглядно — локальный ИИ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1420; --surface:#161E2E; --surface-2:#1E2740;
  --text:#EDF1F7; --text-muted:#8A97AD;
  --accent:#FFB23E; --accent-2:#6C5CE7;
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-text:"Onest","Inter",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --safe-bottom:340px;  /* интерфейс TikTok на вертикали 9:16 */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070c;font-family:var(--font-text);padding:40px;
  display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start}

.card{
  width:1080px;height:1920px;zoom:.30;
  background:var(--bg);color:var(--text);overflow:hidden;border-radius:28px;
  position:relative;display:flex;flex-direction:column;
  padding:96px 72px var(--safe-bottom);border:1px solid #1c2436;
}

.head{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:16px}
.brand b{font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:-.01em}
.eye{width:52px;height:52px;flex:0 0 auto}
.num{font-family:var(--font-mono);font-size:26px;color:var(--accent);letter-spacing:.06em}

.chip{margin-top:40px;align-self:flex-start;background:var(--surface-2);
  border:2px solid var(--accent);border-radius:999px;padding:12px 24px;font-size:26px}
.chip small{color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-right:10px;font-size:22px}


.owner{margin-top:40px;font-family:var(--font-mono);font-size:28px;color:var(--text-muted)}
h1{font-family:var(--font-display);font-weight:700;font-size:84px;line-height:1.05;letter-spacing:-.01em;margin-top:12px}
h1.long{font-size:64px}

.desc{margin-top:32px;font-size:38px;line-height:1.42}
.desc i{font-style:normal;color:var(--text-muted)}

.visual{margin-top:40px;flex:1;min-height:320px;display:flex;flex-direction:column}
.shot{flex:1;border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid #2c3650}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.shot.light{background:#fff}
.shot.light img{object-position:center}
.credit{margin-top:16px;font-family:var(--font-mono);font-size:22px;color:var(--text-muted)}

.iconbox{flex:1;border-radius:22px;background:var(--surface);border:1px solid #2c3650;
  display:flex;align-items:center;justify-content:center}
.iconbox svg{width:300px;height:300px}

.tags{margin-top:32px;display:flex;flex-wrap:wrap;gap:16px}
.tag{font-size:28px;color:var(--text);background:rgba(108,92,231,.22);
  border:1px solid var(--accent-2);border-radius:999px;padding:12px 24px}

.cta{margin-top:36px;background:var(--accent-2);border-radius:20px;padding:30px 36px;
  display:flex;justify-content:space-between;align-items:center;gap:24px}
.cta b{font-size:32px;font-weight:600;color:#fff}
.cta span{font-family:var(--font-mono);font-size:28px;color:#EDE9FF;white-space:nowrap}

.repo{margin-top:24px;font-family:var(--font-mono);font-size:26px;color:var(--text-muted)}

/* ── Обложка поста ── */
.cover .rubric{font-family:var(--font-mono);font-size:26px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--accent)}
.cover .hero{margin-top:56px;display:flex;align-items:baseline;gap:44px}
.cover .big{font-family:var(--font-display);font-weight:700;font-size:210px;line-height:.9;
  color:var(--accent);letter-spacing:-.04em}
.cover .unit{font-family:var(--font-display);font-weight:700;font-size:92px;letter-spacing:-.01em}
.cover h2{margin-top:16px;font-family:var(--font-display);font-weight:700;font-size:82px;
  line-height:1.06;letter-spacing:-.01em}
.cover .sub{margin-top:40px;font-size:38px;line-height:1.4;color:var(--text-muted)}
.cover .sub b{color:var(--text);font-weight:500}
.grid{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid div{height:250px;border-radius:18px;overflow:hidden;border:1px solid #2c3650;background:var(--surface)}
.grid img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.swipe{margin-top:40px;display:flex;justify-content:space-between;align-items:center}
.swipe b{font-size:38px;font-weight:600}
.swipe span{font-family:var(--font-mono);font-size:30px;color:var(--accent)}

.safe{position:absolute;left:0;right:0;bottom:0;height:var(--safe-bottom);
  border-top:1px dashed #2c3650;display:none}
body.show-safe .safe{display:block}
.slidelabel{position:fixed;left:8px;top:8px;background:#000;color:#5b6b8c;font:12px var(--font-mono);
  padding:6px 10px;border-radius:6px;z-index:10}
@media print{body{background:#fff;padding:0;gap:0}.card{zoom:1;margin:0;page-break-after:always;border-radius:0}}
</style>

      <span class="brand">${MASCOT}<b>Наглядно</b></span>
      <span class="num">${String(i + 1).padStart(2, '0')} / ${String(CARDS.length).padStart(2, '0')}</span>
    </div>
    <div class="chip"><small>врубишься за</small>${c.clarity[0]} ${c.clarity[1]}</div>
    <div class="owner">${c.owner} /</div>
    <h1${c.repo.length > 15 ? ' class="long"' : ''}>${c.repo}</h1>
    <p class="desc">${c.desc}</p>
    ${visual}
    <div class="tags">${c.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    <div class="repo">${c.repoline}</div>
    <div class="cta"><b>Ссылки «пощупать» — в Telegram</b><span>@naglyadno_tech →</span></div>
    <div class="safe"></div>
  </div>`;
}).join(''));
</script>
